    <section class="feed">
        <div class="back">
            <h2>Library Feedback Form</h2>
                <div class="form-group">
                    <label>Your Name:</label>
                    <input type="text" placeholder="Eg:john" required>
                </div>

                <div class="form-group">
                    <label>Your Email Id:</label>
                    <input type="email" placeholder="Eg:john@123" required>
                </div>

                <div class="form-group">
                    <label>Does the library offer the materials you need?(If no, specify missing items)</label>
                    <input type="text" placeholder="Yes/No" required>
                </div>

                <div class="form-group">
                    <label>Did you experience any technical issues or errors while using digital resources?</label>
                    <input type="text" placeholder="Yes/No" required>
                </div>


                <div class="form-group">
                    <label>How would you rate our services?</label><br>
                    <div class="form-group2">
                        <input type="radio" name="rating" required>
                        <label>Excellent</label><br>
                    </div>
                    <div class="form-group2">
                        <input type="radio" name="rating">
                        <label>Very Good</label><br>
                    </div>
                    <div class="form-group2">
                        <input type="radio" name="rating">
                        <label>Good</label><br>
                    </div>
                    <div class="form-group2">
                        <input type="radio" name="rating">
                        <label>Satisfactory</label><br>
                    </div>
                    <div class="form-group2">
                        <input type="radio" name="rating">
                        <label>Not Satisfactory</label><br>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comments">Your Feedback/Comments:</label>
                    <textarea placeholder="Please provide your feedback here..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <input type="checkbox">
                    <label>Subscribe to library updates</label>
                </div>

                <button type="submit">Submit Feedback</button>
            </form>
        </div>
    </section>
